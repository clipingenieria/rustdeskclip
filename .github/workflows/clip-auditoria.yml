# Auditoría de procesos: quién crea y cómo termina el servidor de RustDesk (con y sin custom.txt).
name: Clip - Auditoria procesos

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Preparar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\d, C:\d\logs | Out-Null
          $base = "https://github.com/${{ github.repository }}/releases/download"
          Invoke-WebRequest "$base/clip-1.5.3-b2/rustdesk-1.5.3-x86_64.msi" -OutFile C:\d\clip.msi
          Invoke-WebRequest "$base/ci-installer/custom-b.txt" -OutFile C:\d\custom-b.txt
          auditpol /set /subcategory:"Process Creation" /success:enable | Out-Null
          auditpol /set /subcategory:"Process Termination" /success:enable | Out-Null
          reg add "HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit" /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f | Out-Null
          $p = Start-Process msiexec -ArgumentList '/i C:\d\clip.msi /qn /norestart' -Wait -PassThru; "msiexec -> $($p.ExitCode)"
          for ($i=0; $i -lt 30 -and -not (Get-Service RustDesk -ErrorAction SilentlyContinue); $i++) { Start-Sleep 2 }
          exit 0

      - name: Observar con y sin custom.txt
        shell: pwsh
        run: |
          function Observar([string]$nombre) {
            Stop-Service RustDesk -Force -ErrorAction SilentlyContinue; Start-Sleep 2
            taskkill /F /T /IM rustdesk.exe 2>&1 | Out-Null; Start-Sleep 2
            $t0 = Get-Date
            Start-Service RustDesk; Start-Sleep 20
            Write-Host "==================== $nombre ===================="
            $ev = Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4688,4689; StartTime=$t0} -ErrorAction SilentlyContinue |
                  Where-Object { $_.Message -match 'rustdesk' } | Sort-Object TimeCreated
            foreach ($e in ($ev | Select-Object -First 40)) {
              $x = [xml]$e.ToXml(); $d = @{}; foreach ($n in $x.Event.EventData.Data) { $d[$n.Name] = $n.'#text' }
              if ($e.Id -eq 4688) {
                Write-Host ("{0:HH:mm:ss.fff} CREA  pid={1} padre={2} ({3}) cmd={4}" -f $e.TimeCreated, [Convert]::ToInt32($d.NewProcessId,16), [Convert]::ToInt32($d.ProcessId,16), $d.ParentProcessName, $d.CommandLine)
              } else {
                Write-Host ("{0:HH:mm:ss.fff} TERMINA pid={1} estado={2} ({3})" -f $e.TimeCreated, [Convert]::ToInt32($d.ProcessId,16), $d.Status, $d.ProcessName)
              }
            }
            Write-Host "Total eventos: $(@($ev).Count)"
          }
          Remove-Item "C:\Program Files\RustDesk\custom.txt" -ErrorAction SilentlyContinue
          Observar "SIN custom.txt"
          Copy-Item C:\d\custom-b.txt "C:\Program Files\RustDesk\custom.txt"
          Observar "CON custom.txt (solo hide-stop-service)"
          exit 0
