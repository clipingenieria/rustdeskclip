# Prueba automática del instalador de Clip Remote en un Windows real.
# Usa un instalador de PRUEBAS (contraseña desechable, solo registra en una libreta de pruebas).
name: Clip - Prueba del instalador

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release con el instalador de pruebas
        default: ci-installer
        type: string

permissions:
  contents: read

jobs:
  prueba:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preparar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\ci, C:\ci\logs | Out-Null
          $u = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/RustDesk-Setup-CI.exe"
          Invoke-WebRequest $u -OutFile C:\ci\RustDesk-Setup-CI.exe
          "Sesiones:"; query user 2>&1; qwinsta 2>&1
          @'
          function Get-RD {
            Get-CimInstance Win32_Process -Filter "Name='rustdesk.exe'" | ForEach-Object {
              $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
              [pscustomobject]@{ PID = $_.ProcessId; Usuario = $o.User; Sesion = $_.SessionId; Cmd = $_.CommandLine }
            }
          }
          function Server-Logs { (Get-ChildItem "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log\server" -ErrorAction SilentlyContinue | Measure-Object).Count }
          function Check-Estable([string]$nombre, [int]$segundos = 60) {
            Write-Host "==================== COMPROBACIÓN: $nombre ===================="
            Write-Host ("Servicio: " + (Get-Service RustDesk -ErrorAction SilentlyContinue).Status)
            Write-Host ("custom.txt: " + (Test-Path "C:\Program Files\RustDesk\custom.txt"))
            $l0 = Server-Logs
            $pids = @()
            for ($i = 0; $i -lt ($segundos / 10); $i++) {
              $srv = Get-RD | Where-Object { $_.Usuario -eq 'SYSTEM' -and $_.Cmd -like '*--server*' } | Select-Object -First 1
              $pids += $(if ($srv) { $srv.PID } else { 0 })
              Start-Sleep 10
            }
            $l1 = Server-Logs
            Write-Host "Procesos de RustDesk al final:"; Get-RD | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
            Write-Host "PID del servidor del sistema cada 10 s: $($pids -join ', ')"
            Write-Host "Archivos de registro del servidor: $l0 -> $l1"
            $unicos = @($pids | Select-Object -Unique).Count
            [bool]$ok = ($pids -notcontains 0) -and ($unicos -eq 1) -and (($l1 - $l0) -le 2) -and ((Get-Service RustDesk).Status -eq 'Running')
            Write-Host $(if ($ok) { "RESULTADO ${nombre}: OK (servidor del sistema estable)" } else { "RESULTADO ${nombre}: FALLO" })
            return $ok
          }
          function Run-Installer([string]$nombre) {
            Write-Host "==================== INSTALADOR: $nombre ===================="
            $t = Get-Date
            $p = Start-Process C:\ci\RustDesk-Setup-CI.exe -ArgumentList '/quiet' -PassThru -Wait
            Write-Host "Código de salida: $($p.ExitCode)  (duración: $([int]((Get-Date)-$t).TotalSeconds) s)"
            Get-Content C:\ProgramData\RustDesk-Setup.log -ErrorAction SilentlyContinue | Select-Object -Last 30 | Write-Host
            return [bool]($p.ExitCode -eq 0)
          }
          '@ | Set-Content C:\ci\lib.ps1 -Encoding UTF8

      - continue-on-error: true
        name: "Escenario 1: instalación limpia"
        shell: pwsh
        run: |
          . C:\ci\lib.ps1
          $a = Run-Installer "limpia"
          $b = Check-Estable "limpia" 60
          "ESCENARIO1=$($a -and $b)" | Tee-Object -Append C:\ci\resultados.txt

      - continue-on-error: true
        name: "Escenario 2: reinstalar con RustDesk ya instalado"
        shell: pwsh
        run: |
          . C:\ci\lib.ps1
          $a = Run-Installer "reinstalar"
          $b = Check-Estable "reinstalar" 60
          "ESCENARIO2=$($a -and $b)" | Tee-Object -Append C:\ci\resultados.txt

      - continue-on-error: true
        name: "Escenario 3: reinstalar con la ventana de RustDesk abierta"
        shell: pwsh
        run: |
          . C:\ci\lib.ps1
          Start-Process "C:\Program Files\RustDesk\rustdesk.exe"
          Start-Sleep 15
          "Antes de instalar:"; Get-RD | Format-Table -AutoSize | Out-String -Width 300
          $a = Run-Installer "con-ventana-abierta"
          $b = Check-Estable "con-ventana-abierta" 60
          "ESCENARIO3=$($a -and $b)" | Tee-Object -Append C:\ci\resultados.txt

      - continue-on-error: true
        name: "Escenario 4: reproducir el fallo de CLIP20 y comprobar que el instalador lo arregla"
        shell: pwsh
        run: |
          . C:\ci\lib.ps1
          "--- Provocando el fallo: servicio parado, abrir RustDesk (arranca su propio servidor de usuario), y luego arrancar el servicio ---"
          Stop-Service RustDesk -Force; Start-Sleep 3
          taskkill /F /T /IM rustdesk.exe 2>&1 | Out-Null; Start-Sleep 2
          Start-Process "C:\Program Files\RustDesk\rustdesk.exe"; Start-Sleep 20
          Start-Service RustDesk
          $fallo = -not (Check-Estable "fallo-provocado (se espera FALLO)" 40)
          "¿Se reprodujo el fallo?: $fallo"
          $a = Run-Installer "arreglar-fallo"
          $b = Check-Estable "despues-de-arreglar" 90
          "ESCENARIO4_REPRODUCIDO=$fallo" | Tee-Object -Append C:\ci\resultados.txt
          "ESCENARIO4=$($a -and $b)" | Tee-Object -Append C:\ci\resultados.txt

      - continue-on-error: true
        name: "Escenario 5: equipo con un custom.txt sobrante (caso CLIP20)"
        shell: pwsh
        run: |
          . C:\ci\lib.ps1
          Stop-Service RustDesk -Force; Start-Sleep 2
          Set-Content "C:\Program Files\RustDesk\custom.txt" "archivo-sobrante-de-la-version-anterior" -NoNewline
          Start-Service RustDesk
          $fallo = -not (Check-Estable "con custom.txt sobrante (se espera FALLO)" 30)
          $a = Run-Installer "limpiar-custom-sobrante"
          $b = Check-Estable "despues-de-limpiar" 60
          $c = -not (Test-Path "C:\Program Files\RustDesk\custom.txt")
          Write-Host "custom.txt eliminado: $c"
          "ESCENARIO5=$($a -and $b -and $c)" | Tee-Object -Append C:\ci\resultados.txt
          exit 0

      - continue-on-error: true
        name: "Escenario 6: equipo con el RustDesk oficial -> se reemplaza por Clip conservando el ID"
        shell: pwsh
        run: |
          . C:\ci\lib.ps1
          $toml = "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml"
          function Es-Clip { $d = "C:\Program Files\RustDesk\librustdesk.dll"; (Test-Path $d) -and ([IO.File]::ReadAllText($d, [Text.Encoding]::ASCII).Contains("r2dkHyLUnazX9KV8A8kPNEhk/K55QI/2W1/d+/h7DNg=")) }
          function Leer-ID { $m = Select-String -Path $toml -Pattern "^enc_id\s*=\s*'([^']+)'" -ErrorAction SilentlyContinue | Select-Object -First 1; if ($m) { $m.Matches[0].Groups[1].Value } else { "" } }
          Invoke-WebRequest "https://github.com/rustdesk/rustdesk/releases/download/1.5.3/rustdesk-1.5.3-x86_64.msi" -OutFile C:\ci\oficial.msi
          Stop-Service RustDesk -Force -ErrorAction SilentlyContinue; taskkill /F /T /IM rustdesk.exe 2>&1 | Out-Null
          $p = Start-Process msiexec -ArgumentList '/i C:\ci\oficial.msi /qn /norestart' -Wait -PassThru
          Write-Host "Instalado el oficial encima: msiexec $($p.ExitCode)"
          Start-Sleep 10; Start-Service RustDesk -ErrorAction SilentlyContinue; Start-Sleep 10
          $esOficial = -not (Es-Clip); $id0 = Leer-ID
          Write-Host "Antes: oficial=$esOficial ID=$id0"
          $a = Run-Installer "oficial-a-clip"
          $b = Check-Estable "oficial-a-clip" 60
          $esClip = Es-Clip; $id1 = Leer-ID
          Write-Host "Después: clip=$esClip ID=$id1"
          Get-ChildItem "C:\Users\Public\Desktop","C:\ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Write-Host
          "ESCENARIO6=$($esOficial -and $a -and $b -and $esClip -and ($id0 -ne '') -and ($id0 -eq $id1))" | Tee-Object -Append C:\ci\resultados.txt
          exit 0

      - name: Resumen
        if: always()
        shell: pwsh
        run: |
          Get-Content C:\ci\resultados.txt -ErrorAction SilentlyContinue
          Copy-Item C:\ProgramData\RustDesk-Setup*.log C:\ci\logs\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log\service" C:\ci\logs\service -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log\server" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 5 | Copy-Item -Destination (New-Item -ItemType Directory -Force C:\ci\logs\server)
          Copy-Item C:\ci\resultados.txt C:\ci\logs\ -ErrorAction SilentlyContinue
          if ((Get-Content C:\ci\resultados.txt -ErrorAction SilentlyContinue) -match '^ESCENARIO[1-6]=False') { exit 1 }

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-prueba
          path: C:\ci\logs
